{% assign endpoint = site.data.site.ranch.formspree.contact_endpoint %}

<div
  class="contact-form"
  x-data="contactForm($el.dataset)"
  data-endpoint-id="{{ endpoint }}"
>

  <div x-show="state === 'success'" class="form-feedback form-feedback--success" role="alert">
    <strong>Message sent!</strong> We&rsquo;ll get back to you at the email you provided.
  </div>

  <form x-show="state !== 'success'" x-cloak @submit.prevent="submit" novalidate>

    <!-- Formspree honeypot — must stay empty -->
    <input type="text" name="_gotcha" x-model="formData._gotcha"
           class="visually-hidden" tabindex="-1" autocomplete="off" aria-hidden="true">

    <div class="form-row form-row--2col">
      <div class="form-group">
        <label for="contact-name">
          Your Name <span class="form-required" aria-label="required">*</span>
        </label>
        <input type="text" id="contact-name" name="name"
               x-model="formData.name" required
               autocomplete="name" placeholder="Jane Smith">
      </div>
      <div class="form-group">
        <label for="contact-email">
          Email <span class="form-required" aria-label="required">*</span>
        </label>
        <input type="email" id="contact-email" name="email"
               x-model="formData.email" required
               autocomplete="email" placeholder="you@example.com">
      </div>
    </div>

    <div class="form-group">
      <label for="contact-subject">Subject</label>
      <input type="text" id="contact-subject" name="subject"
             x-model="formData.subject" placeholder="How can we help?">
    </div>

    <div class="form-group">
      <label for="contact-message">
        Message <span class="form-required" aria-label="required">*</span>
      </label>
      <textarea id="contact-message" name="message"
                x-model="formData.message" required
                rows="5"
                placeholder="Your question or message&hellip;"></textarea>
    </div>

    <div x-show="state === 'error'" x-cloak
         class="form-feedback form-feedback--error" role="alert"
         x-text="errorMessage"></div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary btn--submit"
              :disabled="state === 'submitting'">
        <span x-show="state !== 'submitting'">Send Message</span>
        <span x-show="state === 'submitting'" x-cloak aria-live="polite">Sending&hellip;</span>
      </button>
    </div>

  </form>
</div>
